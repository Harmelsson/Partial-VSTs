# Builds every plugin for Windows on each push, runs the headless tests, and publishes the zip
# as a GitHub Release ("build-N"), so the user finds it in the "Releases" box on the repo's front
# page. (It is also kept as an Actions artifact, as a backup.)
name: build

on:
  push:
    # Docs-only changes don't need a 15-minute Windows build (or a new Release).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# A newer push to the same branch cancels a still-running older build: only the latest matters.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to create the Release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: deps
          key: juce-8.0.15-${{ runner.os }}

      - name: Configure
        run: cmake -B build -A x64 -DPVST_BUILD_NUMBER=${{ github.run_number }} -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/deps

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $out = "dist/PartialVSTs-build-${{ github.run_number }}"
          New-Item -ItemType Directory -Force "$out/VST3", "$out/Standalone" | Out-Null
          Copy-Item -Recurse build/plugins/*/*_artefacts/Release/VST3/*.vst3 "$out/VST3/"
          Copy-Item build/plugins/*/*_artefacts/Release/Standalone/*.exe "$out/Standalone/"
          Copy-Item docs/TESTING.md "$out/HOW_TO_INSTALL.md"
          Compress-Archive -Path "$out/*" -DestinationPath "PartialVSTs-build-${{ github.run_number }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: PartialVSTs-windows-build-${{ github.run_number }}
          path: dist

      - name: Publish as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build ${{ github.run_number }} (${{ github.ref_name }})"
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Automatic build from commit ${{ github.sha }} on branch `${{ github.ref_name }}`.
            Download the zip below, then follow HOW_TO_INSTALL.md inside it.
            What changed / what to test: see docs/STATUS.md on that branch.
          files: PartialVSTs-build-${{ github.run_number }}.zip
